name: 更正或其他
description: 工具裡的資料錯了，或其他不屬於怪物、物品、地點的資訊（必須附截圖）
title: "[其他] "
labels: ["玩家回報", "待審核", "其他"]
body:
  - type: input
    id: floor
    attributes:
      label: 樓層
      description: 只填數字，例如 1
      placeholder: "1"
    validations:
      required: true
  - type: input
    id: subject
    attributes:
      label: 主題
      placeholder: Tolbana 座標錯了
    validations:
      required: true
  - type: textarea
    id: detail
    attributes:
      label: 說明
      description: 哪裡錯了、正確的是什麼
    validations:
      required: true
  - type: textarea
    id: screenshot
    attributes:
      label: 截圖（必填）
      description: 把截圖拖進這個框，或按 Ctrl+V 貼上。等框裡出現一行圖片連結後再送出。可以放多張。
    validations:
      required: true
