# TEMPORARY (v14 review): mutation run of tests/jm_fix_test.py, one mutant per job. Removed again after the run.
# Runs only on the claude/jm-fix-v14 branch, only when this file or the mutant script changes; writes nothing back.
name: jm_mut14_tmp
on:
  push:
    branches: [claude/jm-fix-v14]
    paths: [.github/workflows/jm_mut14_tmp.yml, .github/mut/mut14.py]
permissions:
  contents: read
jobs:
  mutant:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        m: [M0_unchanged, X1_no_union_across_squares, X2_open_side_ok, X3_bad_not_shared_in_piece,
            X4_no_confirmed_contact_needed, X6_any_own_copy_target, X7_no_0_-1_target_exception, X8_donor_mask_ignored,
            X9_any_neighbour_tile_confirms, X9a_v13_any_neighbour_image_confirms, X10_left_out_not_listed,
            X11_0_-1_skipped_again, X12_unshown_gives_whole, Y1_no_next_run_check, Y2_each_image_alone, Y3_site_now_only,
            Y4_site_next_only, Y5_site_squares_as_now, Y6_one_pass, Y7_no_new_pixels_in_piece_rule, Y8_no_across_rule,
            Y9_no_becoming_shown_rule, Y10_not_near_neighbours, Y11_flip_only_in_taken_images, Y12_cut_not_listed,
            Y13_cut_all_on_flip]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install
        run: |
          pip install "pillow==11.0.0" playwright==1.63.0
          python3 -m playwright install --with-deps chromium
      - name: run mutant ${{ matrix.m }}
        run: |
          mkdir -p out
          PYTHONIOENCODING=utf-8 python3 .github/mut/mut14.py . out "${{ matrix.m }}" | tee out/summary_${{ matrix.m }}.txt
          git diff --exit-code index.html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mut_${{ matrix.m }}
          path: out/
